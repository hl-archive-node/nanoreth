reth-codecs = { version = "0.5.0", default-features = false }
reth-transaction-pool = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-stages-types = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-storage-api = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-errors = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-rpc-convert = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-rpc-eth-types = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
