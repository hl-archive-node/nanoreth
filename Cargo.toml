[package]
name = "reth_hl"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "reth_hl"
path = "src/lib.rs"

[[bin]]
name = "reth-hl"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[dependencies]
reth = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8", default-features = false, features = ["gmp"] }
reth-cli = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-cli-commands = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-basic-payload-builder = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-db = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-db-api = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-chainspec = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-cli-util = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-discv4 = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-engine-primitives = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-ethereum-forks = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-ethereum-payload-builder = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-ethereum-primitives = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-eth-wire = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-eth-wire-types = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-evm = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-evm-ethereum = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-node-core = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
reth-revm = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8", features = ["portable"] }
reth-network = { git = "https://github.com/hl-archive-node/reth", rev = "5c43bf8cdc362fad776cdd7040dcabac67c648e8" }
