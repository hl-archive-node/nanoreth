# alloy dependencies
alloy-genesis = { version = "2.1.1", default-features = false }
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-chains = { version = "0.2.33", default-features = false }
alloy-eips = { version = "2.1.1", default-features = false }
alloy-evm = { version = "0.37.0", default-features = false }
alloy-json-abi = { version = "1.6.1", default-features = false }
alloy-json-rpc = { version = "2.1.1", default-features = false }
alloy-dyn-abi = "1.6.1"
alloy-network = { version = "2.1.1", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["map-foldhash"] }
alloy-rlp = { version = "0.3.16", default-features = false, features = ["core-net"] }
alloy-rpc-types = { version = "2.1.1", features = ["eth"], default-features = false }
alloy-rpc-types-eth = { version = "2.1.1", default-features = false }
alloy-rpc-types-engine = { version = "2.1.1", default-features = false }
alloy-serde = { version = "2.1.1", default-features = false }
alloy-signer = { version = "2.1.1", default-features = false }
alloy-sol-macro = "1.6.1"
alloy-sol-types = { version = "1.6.1", default-features = false }

jsonrpsee = "0.26.0"
jsonrpsee-core = "0.26.0"
jsonrpsee-types = "0.26.0"

# misc dependencies
auto_impl = "1"
async-trait = "0.1.68"
bytes = { version = "1.5", default-features = false }
clap = { version = "4", features = ["derive"] }
cfg-if = { version = "1.0", default-features = false }
derive_more = { version = "2", default-features = false, features = ["full"] }
eyre = "0.6"
futures = "0.3"
lazy_static = "1.4.0"
once_cell = { version = "1.19", default-features = false, features = ["critical-section"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.0", default-features = false }
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.11"
tracing = { version = "0.1.0", default-features = false }
rmp-serde = "1.3"
lz4_flex = "0.12"
ureq = "3.0.12"
backon = { version = "1.5.2", default-features = false, features = ["std-blocking-sleep", "tokio-sleep"] }
aws-sdk-s3 = "1.93.0"
aws-config = "1.8.0"
rayon = "1.7"
time = "0.3.41"
rangemap = "=1.6.0"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }


[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
libc = "0.2"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

# revmc JIT compilation of hot EVM bytecode. Not a default feature: it requires LLVM 22 to
# build. Enable it here and then start the node with `--hl.jit true`; both gates must be open.
# revmc comes in through reth rather than directly: it re-exports the JIT types HL needs, and a
# direct dependency would have to spell the revmc git source exactly as reth does. Turning the
# feature off drops revmc (and its LLVM build requirement) from the graph entirely.
jit = ["reth/jit", "reth-evm-ethereum/jit"]
asm-keccak = [
    "reth-node-core/asm-keccak",
]
min-debug-logs = [
    "tracing/release_max_level_debug",
]
dev = [
    "reth-cli-commands/arbitrary",
    "reth/dev",
    "revm/dev",
]

serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "alloy-rpc-types-eth/serde",
    "bytes/serde",
    "parking_lot/serde",
    "reth-eth-wire/serde",
    "reth-eth-wire-types/serde",
    "reth-ethereum-forks/serde",
    "reth-ethereum-primitives/serde",
    "reth-network/serde",
    "reth-network-api/serde",
    "reth-primitives-traits/serde",
    "reth-revm/serde",
    "reth-trie-common/serde",
    "reth-trie-db/serde",
    "revm/serde",
]

client = [
    "jsonrpsee/client",
    "jsonrpsee/async-client",
    "reth-rpc-eth-api/client",
]

[dev-dependencies]
tempfile = "3.20.0"

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "cargo", "emit_and_set"] }
vergen-git2 = "10.0.1"

# Backport of bluealloy/revm#3805: the inspector could emit a SELFDESTRUCT callback built
# from an unrelated journal entry, so callTracer and trace_replayTransaction reported
# transfers that never happened. Execution, state and receipts are unaffected.
#
# Rebased onto the 41.0.0 series for this upgrade; revm 41 does not carry the fix (it
# landed upstream in 42). All revm crates are pinned together: revm-inspector depends on
# its siblings by path within the monorepo, so patching it alone pulls in duplicate copies
# and fails to compile. Drop this block once reth moves to revm 42.
[patch.crates-io]
revm = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-bytecode = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-context = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-context-interface = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-database = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-database-interface = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-handler = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-inspector = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-interpreter = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-precompile = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-primitives = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
revm-state = { git = "https://github.com/hl-archive-node/revm", rev = "ed244b839fa435ac4a0f1f8d601a5c2d512059c9" }
